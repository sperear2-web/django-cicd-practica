name: CI/CD Django

on:
  push:
    branches: ["main", "ci-setup"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Instalar dependencias y ejecutar tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: django_cicd
          POSTGRES_USER: django_cicd
          POSTGRES_PASSWORD: django_cicd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_ENGINE: postgresql
      DB_NAME: django_cicd
      DB_USER: django_cicd
      DB_PASSWORD: django_cicd
      DB_HOST: localhost
      DB_PORT: 5432
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar migraciones
        run: python manage.py migrate --noinput

      - name: Ejecutar pruebas (python manage.py test)
        run: python manage.py test
