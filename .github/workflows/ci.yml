name: CI/CD Django

on:
  push:
    branches: ["main", "ci-setup"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Instalar dependencias y ejecutar tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: django_cicd
          POSTGRES_USER: django_cicd
          POSTGRES_PASSWORD: django_cicd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_ENGINE: postgresql
      DB_NAME: django_cicd
      DB_USER: django_cicd
      DB_PASSWORD: django_cicd
      DB_HOST: localhost
      DB_PORT: 5432
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar migraciones
        run: python manage.py migrate --noinput

      - name: Ejecutar pruebas (python manage.py test)
        run: python manage.py test

  build-docker:
    name: Construir y validar imagen Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker (Dockerfile -> python:3.10)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: django-cicd-practica:ci

      - name: Levantar Django + PostgreSQL con docker compose
        run: docker compose up -d
        env:
          COMPOSE_PROJECT_NAME: django_cicd_ci

      - name: Esperar a que el contenedor web este listo
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/salud/; then
              echo "Servicio disponible"
              exit 0
            fi
            echo "Esperando contenedor web... intento $i"
            sleep 3
          done
          echo "El servicio no respondio a tiempo"
          docker compose logs
          exit 1

      - name: Validar endpoint de salud (simula navegador)
        run: curl -sf http://localhost:8000/salud/ | tee salud-response.json

      - name: Guardar imagen como artefacto (simulacion de publicacion)
        run: docker save django-cicd-practica:ci -o django-cicd-practica.tar

      - name: Subir artefacto de la imagen Docker
        uses: actions/upload-artifact@v4
        with:
          name: django-cicd-practica-docker-image
          path: django-cicd-practica.tar
          retention-days: 7

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v

  simulate-deploy:
    name: Simular despliegue en carpeta externa
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: "1. Descargar el proyecto (checkout a carpeta externa)"
        uses: actions/checkout@v4
        with:
          path: despliegue-externo

      - name: "2. Descargar artefacto de la imagen Docker generada en el job anterior"
        uses: actions/download-artifact@v4
        with:
          name: django-cicd-practica-docker-image
          path: despliegue-externo

      - name: "3. Cargar la imagen Docker (simula DockerHub/registro de artefactos)"
        working-directory: despliegue-externo
        run: docker load -i django-cicd-practica.tar

      - name: "4. Ejecutar con Docker Compose desde la carpeta externa"
        working-directory: despliegue-externo
        run: docker compose up -d
        env:
          COMPOSE_PROJECT_NAME: django_cicd_deploy

      - name: "5. Esperar a que el servicio este arriba"
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/salud/; then
              echo "Despliegue simulado disponible"
              exit 0
            fi
            sleep 3
          done
          docker compose -f despliegue-externo/docker-compose.yml logs
          exit 1

      - name: "6. Validar desde el navegador (simulado con curl)"
        run: |
          echo "Pagina principal:"
          curl -sf http://localhost:8000/ -o pagina.html -w "HTTP %{http_code}\n"
          echo "Endpoint de salud:"
          curl -sf http://localhost:8000/salud/

      - name: "7. Apagar el despliegue simulado"
        if: always()
        working-directory: despliegue-externo
        run: docker compose down -v
